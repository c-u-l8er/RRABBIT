<!doctype html>
<meta charset="utf-8">
<title>Tier 1 proof — the road</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; font:13px/1.5 ui-sans-serif,system-ui,sans-serif; background:#0b0d13; color:#c9d3e4; }
  header { padding:10px 14px; border-bottom:1px solid #1c2130; }
  h1 { font-size:13px; margin:0; font-weight:600; letter-spacing:.02em; }
  .sub { color:#6b7689; font-size:11px; margin-top:2px; }
  #road { position:relative; height:300px; margin:14px; border:1px solid #1c2130;
          border-radius:6px; background:
            repeating-linear-gradient(90deg,#11131f 0 60px,#141726 60px 120px); overflow:hidden; }
  #centre { position:absolute; left:0; right:0; top:150px; height:2px; background:#c8912f; }
  #signwrap { position:absolute; left:24px; top:18px; display:flex; gap:10px; }
  #readframe { position:absolute; left:300px; top:20px; width:520px; height:260px;
               border:1px dashed #35507a; border-radius:4px; display:none; }
  #readframe.on { display:block; }
  .bar { padding:0 14px 10px; display:flex; gap:6px; flex-wrap:wrap; }
  button { font:12px ui-sans-serif,system-ui,sans-serif; background:#171b28; color:#c9d3e4;
           border:1px solid #2a3145; border-radius:4px; padding:5px 9px; cursor:pointer; }
  button:hover { background:#1e2434; }
  pre { margin:0 14px 14px; padding:10px; background:#0f1219; border:1px solid #1c2130;
        border-radius:6px; font:11px/1.45 ui-monospace,monospace; color:#8fa0bb;
        white-space:pre-wrap; max-height:230px; overflow:auto; }
</style>

<header>
  <h1>Tier 1 proof — the road</h1>
  <div class="sub">DOM, not three.js. What is under test is the transition and the authority
    boundary, not the rendering. ROAD_SHELL.md §12.</div>
</header>

<div id="road">
  <div id="centre"></div>
  <div id="signwrap"></div>
  <div id="readframe"></div>
</div>

<div class="bar">
  <button id="enter">read — promote to live</button>
  <button id="leave">leave — demote to sign</button>
  <button id="try-place">allowed op (place)</button>
  <button id="try-intent">privileged op</button>
  <button id="try-intent-as-cockpit">privileged op, claiming by: 'cockpit'</button>
  <button id="replay-old-gen">replay captured old generation</button>
  <button id="refresh">status</button>
  <button id="handoff">run the handoff</button>
</div>

<pre id="status">…</pre>

<script>
const invoke = (cmd, args) => window.__TAURI__.core.invoke(cmd, args);
/* The road's generation is ASKED FOR, never waited for. `whoami` is the only
   call that needs none, which is what makes it the bootstrap. */
let ROAD_GENERATION = null;
const gen = () => ROAD_GENERATION;

/* ── THE VOCABULARY SEAM (page side). ─────────────────────────────────────
   ROAD_SHELL.md §6.2.1: this is the closed table, the validation, the log and
   the refusal FEEDBACK. It enforces nothing against its own page and is not
   described as a boundary. `by` is recorded here and travels no further than
   the log — the host never reads it.                                        */
const TABLE = {
  place:   { args: ['dash', 'side'], host: 'road_place' },
  promote: { args: ['rect', 'package'], host: 'road_promote' },
  route:   { args: ['kind'],         host: 'road_route' },
  demote:  { args: [],               host: 'road_demote' },
  status:  { args: [],               host: 'road_status' },
  manifest:{ args: [],               host: 'road_manifest' },
  intent:  { args: ['payload'],      host: 'privileged_intent' },
};
const LOG = [];

async function apply(op, args = {}, { by = 'road', generation = null } = {}) {
  const spec = TABLE[op];
  if (!spec) return { ok: false, why: 'OP_UNKNOWN' };
  for (const a of spec.args) {
    if (!(a in args)) return { ok: false, why: `OP_MISSING_ARG:${a}` };
  }
  LOG.push({ op, by, at: Date.now() });
  try {
    const result = await invoke(spec.host, { generation: generation ?? gen(), ...args, by });
    return { ok: true, result };
  } catch (e) {
    /* A refusal from the HOST, surfaced through the seam rather than decided
       by it. The distinction is the whole of §6.2.1. */
    return { ok: false, why: String(e) };
  }
}

/* ── the published sign — no pixels are ever sampled from anywhere ───────── */
let CATALOGUE = null;
let SIGN_PRIMITIVES = 0;

/* ONE SIGN PER PACKAGE, all of them drawn with ZERO LIVE PANES. That is the
   §5 claim in its strongest form: a road is laid out from the coordinator's
   catalogue, and nothing on it required an app to start. */
function drawSigns(catalogue) {
  const wrap = document.getElementById('signwrap');
  wrap.textContent = '';
  SIGN_PRIMITIVES = 0;
  for (const pkg of catalogue.packages) {
    const c = document.createElement('canvas');
    c.width = 240; c.height = 132; c.id = `sign-${pkg.id}`;
    wrap.appendChild(c);
    SIGN_PRIMITIVES += drawSign(c, pkg.sign);
  }
}

function drawSign(c, sign) {
  const g = c.getContext('2d');
  g.clearRect(0, 0, c.width, c.height);
  let n = 0;
  for (const p of sign.primitives) {
    if (p.kind === 'rect') {
      g.fillStyle = '#141a28'; g.strokeStyle = '#2c3549';
      g.fillRect(p.x + .5, p.y + .5, p.w - 1, p.h - 1);
      g.strokeRect(p.x + .5, p.y + .5, p.w - 1, p.h - 1);
    } else if (p.kind === 'line') {
      g.strokeStyle = '#2c3549'; g.beginPath();
      g.moveTo(p.x, p.y + .5); g.lineTo(p.x + p.w, p.y + .5); g.stroke();
    } else if (p.kind === 'text') {
      g.fillStyle = p.weight ? '#dbe4f2' : '#8fa0bb';
      g.font = `${p.weight ?? 400} ${p.size}px ui-sans-serif, system-ui, sans-serif`;
      g.fillText(p.value, p.x, p.y);
    } else { continue; }
    n++;
  }
  return n;
}

const show = (v) => { document.getElementById('status').textContent =
  typeof v === 'string' ? v : JSON.stringify(v, null, 2); };

async function status() {
  const r = await apply('status');
  show(r.ok ? r.result : r);
  return r;
}

/* the read rect, in the road window's logical coordinates */
function readRect() {
  const f = document.getElementById('readframe').getBoundingClientRect();
  return { x: f.x, y: f.y, width: f.width, height: f.height };
}

let CAPTURED_GENERATION = null;

async function promote(pkg, task) {
  document.getElementById('readframe').classList.add('on');
  const r = await apply('promote', { rect: readRect(), package: pkg, task: task ?? null });
  if (r.ok) {
    CAPTURED_GENERATION = r.result.pane.generation;
    document.getElementById('signwrap').style.display = 'none';
  } else {
    document.getElementById('readframe').classList.remove('on');
  }
  return r;
}

async function demote() {
  const r = await apply('demote');
  document.getElementById('readframe').classList.remove('on');
  document.getElementById('signwrap').style.display = '';
  drawSigns(CATALOGUE);
  return r;
}

/* THE HANDOFF, UNDER N = 1. Route by declared acceptance, promote, let the app
   offer, let the COORDINATOR accept, evict, route the accepted result, promote
   the next. At no point are two panes live: eviction is not an optimisation
   here, it is the only way the second app can stand. */
window.__handoff = async (kind, payload) => {
  const steps = [];
  const step = (name, r) => { steps.push({ name, ...r }); return r; };
  const first = step('route', await apply('route', { kind }));
  if (!first.ok) return { ok: false, steps };
  step('promote-1', await promote(first.result.package, { kind, payload }));
  return { ok: true, steps, awaiting: 'the app to offer' };
};

window.__handoffNext = async () => {
  const steps = [];
  const st = await apply('status');
  const ledger = st.ok ? st.result.ledger : [];
  const latest = ledger[ledger.length - 1];
  if (!latest) return { ok: false, why: 'nothing has been ACCEPTED — there is no transfer to route' };
  steps.push({ name: 'evict', ...(await demote()) });
  const next = await apply('route', { kind: latest.kind });
  steps.push({ name: 'route', ...next });
  if (!next.ok) return { ok: false, steps };
  steps.push({ name: 'promote-2',
    ...(await promote(next.result.package, { kind: latest.kind, payload: latest.payload })) });
  return { ok: true, steps, accepted: latest };
};

document.getElementById('handoff').onclick = async () =>
  show(await window.__handoff('document', 'a document that entered the road'));

document.getElementById('enter').onclick = async () => {
  const r = await promote(CATALOGUE.packages[0].id, null);
  show(r.ok ? r.result : r);
};

document.getElementById('leave').onclick = async () => {
  show((await demote()).result ?? 'demoted');
};

document.getElementById('try-place').onclick = async () =>
  show(await apply('place', { dash: 12, side: 1 }));

document.getElementById('try-intent').onclick = async () =>
  show(await apply('intent', { payload: 'do a privileged thing' }));

document.getElementById('try-intent-as-cockpit').onclick = async () =>
  show(await apply('intent', { payload: 'do a privileged thing' }, { by: 'cockpit' }));

document.getElementById('replay-old-gen').onclick = async () =>
  show(await apply('place', { dash: 12, side: 1 }, { generation: CAPTURED_GENERATION ?? 0 }));

document.getElementById('refresh').onclick = status;

/* the probe. A fact written to state that nothing can read is not an
   instrument — PAPER_ROADS.md DOCTRINE, learned there and reused here. */
window.__probe = () => ({
  roadGeneration: gen(),
  signSource: 'coordinator',      /* there is no fetch in this file at all */
  manifestOwner: 'host',
  signPrimitives: SIGN_PRIMITIVES,
  packages: CATALOGUE ? CATALOGUE.packages.map((p) => p.id) : [],
  signVisible: document.getElementById('signwrap').style.display !== 'none',
  readPose: document.getElementById('readframe').classList.contains('on'),
  capturedGeneration: CAPTURED_GENERATION,
  log: LOG.slice(-8),
});
window.__apply = apply;

/* THE SIGN ARRIVES FROM THE COORDINATOR, and this page contains no `fetch`
   at all — `tools/check-acl.mjs` asserts that statically. §5 says a sign is
   renderable before any app is live; an app fetching its own sign only looks
   like that because the file sits in the same bundle. The road asks the HOST,
   which holds the package. No pane has ever existed at this point. */
(async () => {
  const me = await invoke('whoami');
  ROAD_GENERATION = me.principal.generation;
  window.__ROAD_GENERATION = ROAD_GENERATION;   /* for the battery's probes */
  const r = await apply('manifest');
  if (!r.ok) { show(r); return; }
  CATALOGUE = r.result;
  drawSigns(CATALOGUE);
  await status();
  document.body.dataset.ready = '1';
})();
</script>
