<!doctype html>
<meta charset="utf-8">
<title>Notes — a CD app</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; font:13px/1.5 ui-sans-serif,system-ui,sans-serif;
         background:#101725; color:#cfd9ea; padding:14px; }
  h1 { font-size:13px; margin:0 0 2px; }
  .sub { color:#6b7689; font-size:11px; margin-bottom:10px; }
  button { font:12px ui-sans-serif,system-ui,sans-serif; background:#1a2233; color:#cfd9ea;
           border:1px solid #2f3a52; border-radius:4px; padding:5px 9px; cursor:pointer; }
  #counter { font:600 26px ui-monospace,monospace; color:#e6edf9; }
  pre { margin-top:10px; padding:8px; background:#0c1220; border:1px solid #1e2739;
        border-radius:5px; font:11px/1.4 ui-monospace,monospace; color:#8fa0bb;
        white-space:pre-wrap; }
</style>

<h1>Notes</h1>
<div class="sub">a CD app standing in the read pose</div>

<div>counter <span id="counter">0</span></div>
<p><input id="note" placeholder="a note that must survive the round trip" size="42"></p>
<p>
  <button id="inc">+1</button>
  <button id="stall">stop beating</button>
  <button id="who">who am I</button>
</p>
<pre id="out">…</pre>

<script>
const invoke = (c, a) => window.__TAURI__.core.invoke(c, a);

/* THE GENERATION COMES FROM THE HOST, in the URL the host itself built. The
   page did not choose it and cannot raise it: carrying a higher number just
   fails the staleness check the other way. */
const GEN = Number(new URLSearchParams(location.search).get('gen'));

/* ── state preservation is the APP's contract, not the shell's ─────────────
   ROAD_SHELL.md §4.1 / §10.4: the shell cannot checkpoint an app and must not
   claim to. The counter lives in this app's own storage; the host holds no
   copy, and `road_status.host_state` is dumped whole so that can be asserted
   rather than believed.                                                     */
const KEY = 'tier1-proof.counter';
const NOTE = 'tier1-proof.note';
const read = () => { try { return Number(localStorage.getItem(KEY) ?? 0) || 0; }
                     catch { return 0; } };
const write = (n) => { try { localStorage.setItem(KEY, String(n)); } catch {} };
const readNote = () => { try { return localStorage.getItem(NOTE) ?? ''; } catch { return ''; } };

let counter = read();
const noteEl = document.getElementById('note');
noteEl.value = readNote();
noteEl.addEventListener('input', () => {
  try { localStorage.setItem(NOTE, noteEl.value); } catch {}
});
const paint = () => { document.getElementById('counter').textContent = String(counter); };
paint();

const show = (v) => { document.getElementById('out').textContent =
  typeof v === 'string' ? v : JSON.stringify(v, null, 2); };

document.getElementById('inc').onclick = () => { counter++; write(counter); paint(); };

let beating = true, beats = 0, lastBeat = null;
document.getElementById('stall').onclick = () => {
  beating = false;
  show('beating stopped — the host must read `unresponsive`, never `gone`');
};

document.getElementById('who').onclick = async () => {
  try { show(await invoke('pane_hello', { generation: GEN })); }
  catch (e) { show(String(e)); }
};

async function beat() {
  if (!beating) return;
  try { await invoke('pane_beat', { generation: GEN }); beats++; lastBeat = Date.now(); }
  catch (e) { lastBeat = String(e); }
}
beat();
setInterval(beat, 400);

window.__paneProbe = () => ({
  generation: GEN, counter, beating, beats, lastBeat,
  note: noteEl.value, storageKeys: [KEY, NOTE],
});
/* Deliberately reachable: the battery replays a captured old-generation
   request from INSIDE the pane, which is the caller a real stale message
   would come from. */
window.__invokeRaw = (cmd, args) => invoke(cmd, args).then(
  (r) => ({ ok: true, r }), (e) => ({ ok: false, why: String(e) }));
document.body.dataset.ready = '1';
</script>
