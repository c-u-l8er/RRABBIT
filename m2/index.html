<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RRABBIT M2 — the flatten</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #03040a;
        color: #f3ead4;
        font: 12px/1.5 ui-monospace, monospace;
      }
      /* ONE canvas. Greenfield and three.js share this element and therefore
         share its WebGL context -- there is no second canvas in M1, which is
         the whole difference from M0. */
      #gl {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #why {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 10px;
        z-index: 4;
        max-width: 92vw;
        text-align: center;
        color: #ff5a3c;
        text-shadow: 0 0 6px #03040a, 0 0 12px #03040a;
        pointer-events: none;
      }
      #why[data-state='stale'] {
        color: #8f8fa0;
      }
      #status {
        position: fixed;
        left: 12px;
        top: 12px;
        z-index: 4;
        padding: 6px 10px;
        background: rgba(3, 4, 10, 0.85);
        border: 1px solid #c8862a;
        color: #f2c14e;
      }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="status">booting</div>
    <!-- Invariant 1 lives here: whatever is over its redline, and WHY. Empty
         when nothing is, so it is a signal rather than furniture. -->
    <div id="why"></div>
    <script type="module" src="./shell.js"></script>
  </body>
</html>
